<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>证型档案 · 本草辨证</title>
<style>
:root{color-scheme:light;--bg:#EDF2EC;--panel:#F9FBF7;--panel-raised:#F1F5EE;--paper:#26312A;--ink:#26312A;--muted:#6E7A70;--line:#D9E3D6;--acid:#2F6B52;--accent:#2F6B52;--accent-strong:#1F4D3B;--accent-soft:rgba(47,107,82,.12);--orange:#C98A5E;--violet:#7E9BB8;--blue:#5B8DB8;--gold:#C9A35A;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--paper);font-family:Inter,"Microsoft YaHei","PingFang SC",sans-serif;line-height:1.75;}
a{color:var(--muted);text-decoration:none;}a:hover{color:var(--acid);}
.wrap{max-width:1240px;margin:0 auto;padding:20px 22px 60px;}
.topbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:18px;flex-wrap:wrap;gap:8px;}
.brand{font-size:13px;letter-spacing:2px;color:var(--muted);}.brand b{color:var(--acid);}
.nav{display:flex;gap:14px;font-size:13px;}
h1{font-size:24px;margin:0 0 3px;}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:18px;}
.layout{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start;}
.side{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px;position:sticky;top:14px;max-height:calc(100vh - 100px);overflow:auto;}
.side input{width:100%;background:var(--panel-raised);color:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;font-family:inherit;margin-bottom:10px;}
.side input:focus{outline:none;border-color:rgba(47,107,82,.4);}
.grp{font-size:11px;color:var(--muted);letter-spacing:1px;margin:11px 4px 5px;}
.ci{display:block;width:100%;text-align:left;background:transparent;border:0;border-left:2px solid transparent;color:var(--paper);padding:7px 10px;font-size:12.5px;cursor:pointer;border-radius:0 6px 6px 0;font-family:inherit;}
.ci:hover{background:var(--panel-raised);}
.ci.on{background:var(--panel-raised);border-left-color:var(--acid);color:var(--acid);}
.main{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:24px 28px;min-height:500px;}
.ptitle{font-size:26px;font-weight:600;margin:0 0 6px;}
.pmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted);}
.tag.hi{border-color:rgba(47,107,82,.45);color:var(--acid);}
h3{font-size:12px;color:var(--muted);letter-spacing:2px;font-weight:600;margin:22px 0 9px;padding-left:9px;border-left:2px solid var(--acid);}
.chips{display:flex;gap:7px;flex-wrap:wrap;}
.chip{font-size:12px;padding:4px 11px;border-radius:6px;background:var(--panel-raised);border:1px solid var(--line);}
.chip.a{border-color:rgba(47,107,82,.3);color:var(--acid);}
.kv{display:grid;grid-template-columns:80px 1fr;gap:6px 12px;font-size:13px;}
.kv dt{color:var(--muted);font-size:12px;}
.kv dd{margin:0;}
.formula{font-size:15px;font-weight:600;color:var(--gold);}
.fx{font-size:12.5px;color:#6E7A70;margin-top:4px;}
.cmp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;font-size:12.5px;}
.cmp:hover{border-color:rgba(47,107,82,.35);}
.bar{width:90px;height:5px;border-radius:3px;background:var(--panel-raised);overflow:hidden;}
.bar i{display:block;height:100%;background:var(--violet);}
.cls{border-left:2px solid var(--line);padding-left:11px;margin-bottom:10px;font-size:13px;line-height:1.9;}
.cls b{color:var(--acid);font-size:12px;}
.acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px;padding-top:16px;border-top:1px solid var(--line);}
.acts a{font-size:12.5px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel-raised);color:var(--paper);}
.acts a.p{background:var(--acid);color:#F7FAF6;border-color:var(--acid);font-weight:700;}
.empty{color:var(--muted);font-size:13px;}
@media(max-width:820px){.layout{grid-template-columns:1fr;}.side{position:static;max-height:240px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">本草辨证 · <b>证型档案</b></div>
    <div class="nav">
      <a href="/">检索</a><a href="/classics.html">经典</a><a href="/train.html">训练</a>
      <a href="/progress.html">报告</a>
      <a href="/static/assistant.html">助手</a>
      <a href="/static/profile.html" style="color:var(--acid);font-weight:600">档案</a>
    </div>
  </div>
  <h1>证型档案</h1>
  <div class="sub">按证型查全部信息：典型症状、舌脉、代表方、易混证型、相关经典条文。共 <span id="cnt">—</span> 个证型。</div>
  <div class="layout">
    <aside class="side">
      <input id="q" placeholder="搜索证型名或症状…" autocomplete="off">
      <div id="list"><div class="empty">加载中…</div></div>
    </aside>
    <main class="main" id="main"><div class="empty">← 从左侧选择一个证型</div></main>
  </div>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function pct(x){ return x==null ? "—" : Math.round(x*100)+"%"; }

var KB = [], CMP = [], CLS = [], CUR = null;

function getJSON(u){ return fetch(u).then(function(r){ return r.json(); }).catch(function(){ return null; }); }

Promise.all([
  getJSON("/api/syndromes"),
  getJSON("/api/quiz/compare/syndromes"),
  getJSON("/api/classics")
]).then(function(res){
  KB = (res[0] && res[0].data) || [];
  CMP = (res[1] && res[1].data) || [];
  CLS = (res[2] && res[2].entries) || [];

  $("cnt").textContent = KB.length;
  renderList("");
  if (KB.length) select(KB[0].name);
}).catch(function(e){
  $("list").innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
});

/* ---------- 左侧列表 ---------- */
function renderList(q){
  q = (q||"").trim();
  var rows = KB;
  if (q) rows = KB.filter(function(x){
    return x.name.indexOf(q) >= 0 || (x.symptoms||[]).some(function(s){ return s.indexOf(q) >= 0; });
  });
  if (!rows.length){ $("list").innerHTML = '<div class="empty">没有匹配的证型</div>'; return; }
  var grp = {};
  rows.forEach(function(x){ var c = x.category || "其他"; (grp[c] = grp[c] || []).push(x); });
  var h = "";
  Object.keys(grp).forEach(function(c){
    h += '<div class="grp">' + esc(c) + '</div>';
    grp[c].forEach(function(x){
      h += '<button class="ci' + (CUR === x.name ? ' on' : '') + '" data-n="' + esc(x.name) + '">' + esc(x.name) + '</button>';
    });
  });
  $("list").innerHTML = h;
}

/* ---------- 相似度（Jaccard） ---------- */
function sim(a, b){
  var A = a.symptoms || [], B = b.symptoms || [];
  if (!A.length || !B.length) return 0;
  var setB = {}; B.forEach(function(x){ setB[x] = 1; });
  var inter = A.filter(function(x){ return setB[x]; }).length;
  var uni = new Set(A.concat(B)).size;
  return uni ? inter / uni : 0;
}

/* ---------- 匹配 compare 库的典型表现（去「证」字） ---------- */
function cmpOf(name){
  var n = name.replace(/证$/, "");
  return CMP.filter(function(x){ return (x.syndrome||"").replace(/证$/, "") === n; })[0] || null;
}

/* ---------- 详情 ---------- */
function select(name){
  var x = KB.filter(function(y){ return y.name === name; })[0];
  if (!x) return;
  CUR = name;
  renderList($("q").value);
  var d = x.detail || {};
  var f = d.formula || {};
  var cmp = cmpOf(name);

  var h = '<h2 class="ptitle">' + esc(x.name) + '</h2>';
  h += '<div class="pmeta"><span class="tag hi">' + esc(x.category || "未分类") + '</span>'
     + '<span class="tag">' + (x.symptoms||[]).length + ' 个典型症状</span>'
     + (cmp ? '<span class="tag">鉴别库有收录</span>' : '') + '</div>';

  h += '<h3>典型症状</h3><div class="chips">'
     + (x.symptoms||[]).map(function(s){ return '<span class="chip a">' + esc(s) + '</span>'; }).join("")
     + '</div>';

  if (d.tongue || d.pulse){
    h += '<h3>舌象与脉象</h3><dl class="kv">'
       + (d.tongue ? '<dt>舌象</dt><dd>' + esc(d.tongue) + '</dd>' : '')
       + (d.pulse ? '<dt>脉象</dt><dd>' + esc(d.pulse) + '</dd>' : '')
       + '</dl>';
  }

  if (f.name){
    h += '<h3>代表方</h3>'
       + '<div class="formula">' + esc(f.name) + '</div>'
       + (f.effect ? '<div class="fx">功效：' + esc(f.effect) + '</div>' : '')
       + (f.composition ? '<div class="fx">组成：' + esc(f.composition) + '</div>' : '');
  }

  if (cmp && (cmp.typical || (cmp.signature||[]).length)){
    h += '<h3>真实病历中的高频表现</h3>';
    if (cmp.n_cases) h += '<div class="fx" style="margin-bottom:6px">基于 ' + cmp.n_cases + ' 条病历统计</div>';
    h += '<div class="chips">'
       + (cmp.signature||[]).slice(0,10).map(function(s){
           return '<span class="chip">' + esc(s.w) + ' <span style="color:#6e7a6c">' + Math.round((s.rate||0)*100) + '%</span></span>';
         }).join("")
       + '</div>';
  }

  // 易混证型：同分类优先 + Jaccard 相似度
  var others = KB.filter(function(y){ return y.name !== name; })
    .map(function(y){ return { name: y.name, cat: y.category, s: sim(x, y) }; })
    .sort(function(a, b){ return b.s - a.s; })
    .slice(0, 5);
  if (others.length){
    h += '<h3>症状最接近的证型</h3>';
    others.forEach(function(o){
      h += '<div class="cmp"><span>' + esc(o.name) + ' <span style="color:#6e7a6c;font-size:11px">' + esc(o.cat||"") + '</span></span>'
         + '<span style="display:flex;align-items:center;gap:9px"><span class="bar"><i style="width:' + Math.round(o.s*100) + '%"></i></span>'
         + '<span style="color:#7E9BB8;font-size:11.5px;width:38px;text-align:right">' + Math.round(o.s*100) + '%</span></span></div>';
    });
    h += '<div class="fx" style="margin-top:5px">相似度按典型症状的重合比例计算，仅供对照，不代表临床易混程度。</div>';
  }

  // 相关经典条文
  var rel = CLS.filter(function(e){ return (e.syndromes||[]).indexOf(name) >= 0; });
  if (rel.length){
    h += '<h3>相关经典条文</h3>';
    rel.slice(0,3).forEach(function(e){
      h += '<div class="cls"><b>《伤寒论》第' + e.no + '条</b><div>' + esc(e.text) + '</div></div>';
    });
  }

  h += '<div class="acts">'
     + '<a class="p" href="/train.html?m=quiz">练这个证型</a>'
     + '<a href="/train.html?m=compare">看与易混证型的鉴别</a>'
     + '<a href="/train.html?m=formula">查方剂治法</a>'
     + '<a href="/static/assistant.html">去问助手</a>'
     + '</div>';

  $("main").innerHTML = h;
}

/* ---------- 事件 ---------- */
$("list").addEventListener("click", function(e){
  var b = e.target.closest(".ci");
  if (b) select(b.dataset.n);
});
$("q").addEventListener("input", function(){ renderList(this.value); });
</script>
</body>
</html>
